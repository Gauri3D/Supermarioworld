<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Gauri.3D | Super Mario World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100d1c;color:#fff;font-family:system-ui,Arial,sans-serif}body{overflow:hidden;touch-action:manipulation}#game{position:absolute;top:0;left:0;width:100%;height:calc(100dvh - 225px);background:#000}.welcome{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(145deg,#1e143b,#6c3379)}.welcome[hidden]{display:none}.panel{text-align:center;padding:32px 22px;max-width:420px}.brand{font-weight:900;letter-spacing:3px;color:#ffc2eb;font-size:2.2rem}h1{font-size:1.7rem}#start{padding:15px 25px;border:0;border-radius:14px;background:#f5a6d8;color:#271333;font-weight:800;font-size:1rem}#status{font-size:.9rem;color:#e5d8ef;margin-top:18px;line-height:1.5}.help{font-size:.85rem;line-height:1.5;color:#eee}
#pad{position:fixed;bottom:0;left:0;right:0;height:225px;background:#21172f;border-top:2px solid #71498b;display:none;justify-content:space-between;align-items:center;padding:12px max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:10px;z-index:12;user-select:none;-webkit-user-select:none;touch-action:none}#pad.visible{display:flex}.dpad{width:144px;height:144px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px;flex-shrink:0}.key{border:1px solid #a787bb;background:#49325c;color:white;border-radius:12px;font-weight:900;font-size:19px;touch-action:none;-webkit-tap-highlight-color:transparent}.key:active,.key.pressed{background:#d68bd4;color:#24152e}.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}.middle{grid-area:2/2;background:#32243f;border-radius:6px}.center{display:flex;flex-direction:column;gap:12px;align-self:flex-end;margin-bottom:18px}.small{font-size:10px;padding:10px 5px;border-radius:16px;min-width:52px}.abxy{width:142px;height:142px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;flex-shrink:0}.abxy .key{border-radius:50%;background:#723d86}.abxy .key:active,.abxy .key.pressed{background:#f5a6d8}.y{grid-area:2/1}.x{grid-area:1/2}.b{grid-area:3/2}.a{grid-area:2/3}#notice{position:fixed;top:8px;left:8px;right:8px;z-index:15;display:none;padding:10px;background:#412747;border-radius:10px;font-size:12px;text-align:center}#notice.visible{display:block}@media(max-width:370px){.dpad,.abxy{width:118px;height:118px}.key{font-size:16px}.center{gap:8px}.small{min-width:42px;font-size:9px}}@media(orientation:landscape){#pad{height:150px}.dpad,.abxy{width:124px;height:124px}#game{height:calc(100dvh - 150px)}.center{margin-bottom:10px}}
</style></head><body>
<div id="game"></div><div id="notice" role="status"></div>
<section id="welcome" class="welcome"><div class="panel"><div class="brand">GAURI.3D</div><h1>Super Mario World</h1><p>Tu aventura retro comienza aquí.</p><p class="help">Controles táctiles incluidos para iPhone y Android.</p><button id="start">INICIAR JUEGO</button><p id="status">Listo para jugar.</p></div></section>
<div id="pad" aria-label="Controles táctiles Super Nintendo"><div class="dpad"><button class="key up" data-key="ArrowUp">▲</button><button class="key left" data-key="ArrowLeft">◀</button><div class="middle"></div><button class="key right" data-key="ArrowRight">▶</button><button class="key down" data-key="ArrowDown">▼</button></div><div class="center"><button class="key small" data-key="Shift">SELECT</button><button class="key small" data-key="Enter">START</button></div><div class="abxy"><button class="key x" data-key="s">X</button><button class="key y" data-key="a">Y</button><button class="key b" data-key="z">B</button><button class="key a" data-key="x">A</button></div></div>
<script>
const start=document.getElementById('start'),welcome=document.getElementById('welcome'),status=document.getElementById('status'),pad=document.getElementById('pad'),notice=document.getElementById('notice');
const keyCodes={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,Enter:13,Shift:16,a:65,s:83,z:90,x:88};
function sendKey(key,type){const code=keyCodes[key];const event=new KeyboardEvent(type,{key:key,code:key.startsWith('Arrow')?key:key.length===1?'Key'+key.toUpperCase():key,keyCode:code,which:code,bubbles:true,cancelable:true});document.dispatchEvent(event);window.dispatchEvent(event);}
for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;const release=ev=>{ev.preventDefault();if(!b.classList.contains('pressed'))return;b.classList.remove('pressed');sendKey(key,'keyup')};b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);b.classList.add('pressed');sendKey(key,'keydown')});b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)}
function message(msg){notice.textContent=msg;notice.classList.add('visible')}
start.addEventListener('click',()=>{start.disabled=true;start.textContent='CARGANDO…';status.textContent='Preparando el emulador…';pad.classList.add('visible');
window.EJS_player='#game';window.EJS_core='snes';window.EJS_gameName='Super Mario World';window.EJS_color='#c77de8';window.EJS_startOnLoaded=true;window.EJS_gameUrl='./Super%20Mario%20World%20(USA).sfc';window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_mouse=false;window.EJS_scaleControls=true;window.EJS_forceLocalSave=true;window.EJS_AdPhant_MobileGamepad=false;window.EJS_mobileGamepad=false;
window.EJS_ready=()=>{welcome.hidden=true;message('Si el juego muestra un botón de reproducción, púlsalo para comenzar.');setTimeout(()=>notice.classList.remove('visible'),8000)};
window.EJS_onGameStart=()=>{welcome.hidden=true;notice.classList.remove('visible')};
const script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.onerror=()=>{status.textContent='Error: no se pudo descargar EmulatorJS. Revisa tu conexión e inténtalo nuevamente.';start.disabled=false;start.textContent='REINTENTAR';message('No se pudo cargar el emulador.')};document.body.appendChild(script);
setTimeout(()=>{if(!welcome.hidden){status.textContent='El emulador tarda demasiado. Comprueba que GitHub Pages terminó de publicar y vuelve a intentar.';start.disabled=false;start.textContent='REINTENTAR';message('El emulador no confirmó que estuviera listo.')}},20000);
});
</script></body></html>
