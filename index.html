<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gauri.3D | Super Nintendo</title><style>
*{box-sizing:border-box}body{margin:0;background:#171326;color:white;font-family:system-ui,Arial,sans-serif}#game{min-height:100dvh}.welcome{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(145deg,#1e143b,#6c3379)}.welcome[hidden]{display:none}.panel{text-align:center;padding:32px 22px;max-width:420px}.brand{font-weight:900;letter-spacing:3px;color:#ffc2eb;font-size:2.2rem}h1{font-size:1.7rem}button{padding:15px 25px;border:0;border-radius:14px;background:#f5a6d8;color:#271333;font-weight:800;font-size:1rem;cursor:pointer}button:disabled{opacity:.6}#status{font-size:.9rem;color:#e5d8ef;margin-top:18px}.help{font-size:.85rem;line-height:1.5;color:#eee}</style></head><body>
<div id="game"></div><section id="welcome" class="welcome"><div class="panel"><div class="brand">GAURI.3D</div><h1>Super Nintendo</h1><p>Tu aventura retro comienza aquí.</p><p class="help">Selecciona desde tu dispositivo una copia de juego SNES que tengas derecho a utilizar (.sfc o .smc). El archivo se procesa en tu navegador y no se sube a GitHub.</p><input type="file" id="rom" accept=".sfc,.smc,.zip" style="max-width:100%;margin:15px auto;display:block"><button id="start" disabled>INICIAR JUEGO</button><p id="status">Selecciona tu archivo para continuar.</p></div></section>
<script>
const rom=document.getElementById('rom'),start=document.getElementById('start'),welcome=document.getElementById('welcome'),status=document.getElementById('status');let url;
rom.addEventListener('change',()=>{start.disabled=!rom.files.length;status.textContent=rom.files.length?'Archivo seleccionado. Pulsa INICIAR JUEGO.':'Selecciona tu archivo para continuar.'});
start.addEventListener('click',()=>{const file=rom.files[0];if(!file)return;start.disabled=true;start.textContent='CARGANDO…';url=URL.createObjectURL(file);window.EJS_player='#game';window.EJS_core='snes';window.EJS_gameName=file.name.replace(/\.(sfc|smc|zip)$/i,'');window.EJS_color='#c77de8';window.EJS_startOnLoaded=false;window.EJS_AdPhant_MobileGamepad=true;window.EJS_mouse=false;window.EJS_GamepadOpacity='0.7';window.EJS_scaleControls=true;window.EJS_forceLocalSave=true;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_gameUrl=url;window.EJS_ready=()=>{welcome.hidden=true;};const script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.onerror=()=>{status.textContent='No se pudo cargar el emulador. Actualiza la página e inténtalo nuevamente.'};document.body.appendChild(script)});
</script></body></html>
